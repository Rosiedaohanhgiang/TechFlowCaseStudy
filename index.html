<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Rescue Canvas - TechFlow Workbook</title>
    
    <!-- LIBRARIES -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- REPLACED: Lucide with FontAwesome for React Stability -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        // Fix Tailwind Loading Race Condition
        const checkTailwind = setInterval(() => {
            if (window.tailwind) {
                clearInterval(checkTailwind);
                tailwind.config = {
                    darkMode: 'class',
                    theme: {
                        extend: {
                            fontFamily: { sans: ['Inter', 'sans-serif'], header: ['Oswald', 'sans-serif'] },
                            colors: { 
                                slate: { 950: '#020617', 900: '#0F172A', 800: '#1E293B' }, 
                                brand: { orange: '#FF9800', teal: '#009688', red: '#EF4444' } 
                            }
                        }
                    }
                }
            }
        }, 100);
    </script>

    <style>
        body { background-color: #0F172A; color: white; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: white; width: 100%; padding: 12px; border-radius: 8px; transition: 0.3s; }
        .input-field:focus { outline: none; border-color: #FF9800; box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.2); }
        
        /* Print Styles */
        @media print {
            body { background: white; color: black; }
            .no-print { display: none !important; }
            .glass-panel { background: white; border: 1px solid #ccc; color: black; box-shadow: none; break-inside: avoid; margin-bottom: 20px; }
            .input-field { background: white; border: 1px solid #ccc; color: black; }
            h1, h2, h3 { color: #000 !important; }
            .text-brand-orange { color: #d97706 !important; }
            .text-brand-teal { color: #0f766e !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATA STRUCTURE ---
        const MODULES = [
            { id: 1, title: 'Chẩn Đoán & Tư Duy', icon: 'fa-brain', color: 'text-red-400' },
            { id: 2, title: 'Thiết Kế OKRs', icon: 'fa-bullseye', color: 'text-brand-orange' },
            { id: 3, title: 'Kỹ Năng CFRs', icon: 'fa-comments', color: 'text-brand-teal' },
            { id: 4, title: 'Total Rewards', icon: 'fa-gift', color: 'text-purple-400' },
            { id: 5, title: 'EX Mapping', icon: 'fa-map', color: 'text-pink-400' },
            { id: 6, title: 'Cam Kết Hành Động', icon: 'fa-flag', color: 'text-green-400' }
        ];

        const App = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [data, setData] = useState({
                // Module 1
                m1_root_cause: '',
                m1_solution: '',
                // Module 2
                m2_objective: '',
                m2_kr_sales: '',
                m2_kr_product: '',
                // Module 3
                m3_script_checkin: '',
                m3_script_sbi: '',
                m3_script_coach: '',
                // Module 4
                m4_dev: '',
                m4_rec: '',
                m4_well: '',
                // Module 5
                m5_pre: '',
                m5_first: '',
                m5_lunch: '',
                // Module 6
                m6_act1: '',
                m6_act2: '',
                m6_act3: ''
            });

            // Load from LocalStorage
            useEffect(() => {
                const saved = localStorage.getItem('phoenix_canvas_data');
                if (saved) setData(JSON.parse(saved));
            }, []);

            // Save to LocalStorage
            const handleChange = (field, value) => {
                const newData = { ...data, [field]: value };
                setData(newData);
                localStorage.setItem('phoenix_canvas_data', JSON.stringify(newData));
            };

            const handlePrint = () => window.print();

            const renderContent = () => {
                switch(activeTab) {
                    case 1: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-red-900/20 border-l-4 border-red-500 p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-red-400 mb-2">Tình huống:</h3>
                                <p className="text-gray-300">Minh (Sales) và Lan (Product) xung đột gay gắt. Tuấn (Dev mới) im lặng và muốn nghỉ việc.</p>
                            </div>
                            
                            <div className="glass-panel p-6 rounded-xl">
                                <label className="block text-brand-orange font-bold mb-2">1. Nguyên nhân gốc rễ (Tư duy cũ):</label>
                                <textarea className="input-field h-24" placeholder="Ví dụ: Coi nhân viên là công cụ, quản lý theo kiểu kiểm soát..." value={data.m1_root_cause} onChange={(e) => handleChange('m1_root_cause', e.target.value)}></textarea>
                            </div>

                            <div className="glass-panel p-6 rounded-xl">
                                <label className="block text-brand-teal font-bold mb-2">2. Giải pháp hướng tới (Tư duy mới):</label>
                                <textarea className="input-field h-24" placeholder="Ví dụ: Cần sự thấu cảm, chuyển từ Managing sang Unlocking..." value={data.m1_solution} onChange={(e) => handleChange('m1_solution', e.target.value)}></textarea>
                            </div>
                        </div>
                    );
                    case 2: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-orange-900/20 border-l-4 border-brand-orange p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-brand-orange mb-2">Bài tập: "Cú bắt tay" OKRs</h3>
                                <p className="text-gray-300">Viết lại mục tiêu chung cho Dự án Phoenix để Minh và Lan cùng nhìn về một hướng.</p>
                            </div>

                            <div className="glass-panel p-6 rounded-xl space-y-4">
                                <div>
                                    <label className="block text-white font-bold mb-2">Objective (Mục tiêu chung đầy cảm hứng):</label>
                                    <input type="text" className="input-field" placeholder="VD: Chinh phục 10 khách hàng Enterprise đầu tiên..." value={data.m2_objective} onChange={(e) => handleChange('m2_objective', e.target.value)} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-gray-400 text-sm mb-2">Key Result 1 (Sales):</label>
                                        <input type="text" className="input-field" placeholder="VD: 10 Hợp đồng đã ký..." value={data.m2_kr_sales} onChange={(e) => handleChange('m2_kr_sales', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 text-sm mb-2">Key Result 2 (Product):</label>
                                        <input type="text" className="input-field" placeholder="VD: 100% Khách hàng hài lòng..." value={data.m2_kr_product} onChange={(e) => handleChange('m2_kr_product', e.target.value)} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                    case 3: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-teal-900/20 border-l-4 border-brand-teal p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-brand-teal mb-2">Tình huống: Sự cố của Tuấn</h3>
                                <p className="text-gray-300">Đóng vai Lan, thực hiện buổi Check-in thay vì mắng mỏ.</p>
                            </div>

                            <div className="glass-panel p-6 rounded-xl space-y-4">
                                <div>
                                    <label className="block text-brand-teal font-bold mb-2">Bước 1: Check-in Cảm xúc</label>
                                    <input type="text" className="input-field" placeholder="Tuấn, em đang cảm thấy thế nào..." value={data.m3_script_checkin} onChange={(e) => handleChange('m3_script_checkin', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-brand-teal font-bold mb-2">Bước 2: Phản hồi bằng SBI (Bối cảnh - Hành vi - Tác động)</label>
                                    <textarea className="input-field h-24" placeholder="Hôm qua khi deploy (S), em đã bỏ qua test (B), khiến hệ thống sập (I)..." value={data.m3_script_sbi} onChange={(e) => handleChange('m3_script_sbi', e.target.value)}></textarea>
                                </div>
                                <div>
                                    <label className="block text-brand-teal font-bold mb-2">Bước 3: Câu hỏi Coaching (Quyền lực)</label>
                                    <input type="text" className="input-field" placeholder="Em nghĩ giải pháp để không lặp lại là gì?..." value={data.m3_script_coach} onChange={(e) => handleChange('m3_script_coach', e.target.value)} />
                                </div>
                            </div>
                        </div>
                    );
                    case 4: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-purple-900/20 border-l-4 border-purple-400 p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-purple-400 mb-2">Bài tập: Giữ người không dùng Tiền</h3>
                                <p className="text-gray-300">Thiết kế gói Total Rewards để giữ chân Tuấn trước offer lương cao của đối thủ.</p>
                            </div>

                            <div className="grid grid-cols-3 gap-4">
                                <div className="glass-panel p-4 rounded-xl">
                                    <label className="block text-purple-300 font-bold mb-2 text-center">Trụ cột Phát triển</label>
                                    <textarea className="input-field h-32" placeholder="VD: Mentor 1:1, Khóa học AI..." value={data.m4_dev} onChange={(e) => handleChange('m4_dev', e.target.value)}></textarea>
                                </div>
                                <div className="glass-panel p-4 rounded-xl">
                                    <label className="block text-purple-300 font-bold mb-2 text-center">Trụ cột Ghi nhận</label>
                                    <textarea className="input-field h-32" placeholder="VD: Giải Hero of the Week..." value={data.m4_rec} onChange={(e) => handleChange('m4_rec', e.target.value)}></textarea>
                                </div>
                                <div className="glass-panel p-4 rounded-xl">
                                    <label className="block text-purple-300 font-bold mb-2 text-center">Trụ cột An sinh</label>
                                    <textarea className="input-field h-32" placeholder="VD: Remote 2 ngày/tuần..." value={data.m4_well} onChange={(e) => handleChange('m4_well', e.target.value)}></textarea>
                                </div>
                            </div>
                        </div>
                    );
                    case 5: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-pink-900/20 border-l-4 border-pink-400 p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-pink-400 mb-2">Bài tập: Vẽ lại nụ cười ngày đầu tiên</h3>
                                <p className="text-gray-300">Thiết kế 3 "Điểm chạm WOW" cho nhân viên mới (Onboarding).</p>
                            </div>

                            <div className="relative border-l-2 border-pink-500 ml-4 pl-8 py-4 space-y-8">
                                <div className="relative">
                                    <span className="absolute -left-[41px] top-0 bg-pink-500 w-6 h-6 rounded-full border-4 border-slate-900"></span>
                                    <label className="block text-pink-300 font-bold mb-2">1. Trước ngày đi làm (Pre-boarding)</label>
                                    <input type="text" className="input-field" placeholder="VD: Gửi thư chào mừng + Áo thun về nhà..." value={data.m5_pre} onChange={(e) => handleChange('m5_pre', e.target.value)} />
                                </div>
                                <div className="relative">
                                    <span className="absolute -left-[41px] top-0 bg-pink-500 w-6 h-6 rounded-full border-4 border-slate-900"></span>
                                    <label className="block text-pink-300 font-bold mb-2">2. Giờ đầu tiên (First Hour)</label>
                                    <input type="text" className="input-field" placeholder="VD: Máy tính sẵn sàng, thiệp tay của CEO..." value={data.m5_first} onChange={(e) => handleChange('m5_first', e.target.value)} />
                                </div>
                                <div className="relative">
                                    <span className="absolute -left-[41px] top-0 bg-pink-500 w-6 h-6 rounded-full border-4 border-slate-900"></span>
                                    <label className="block text-pink-300 font-bold mb-2">3. Bữa trưa đầu tiên</label>
                                    <input type="text" className="input-field" placeholder="VD: Buddy dẫn đi ăn ngon..." value={data.m5_lunch} onChange={(e) => handleChange('m5_lunch', e.target.value)} />
                                </div>
                            </div>
                        </div>
                    );
                    case 6: return (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-green-900/20 border-l-4 border-green-400 p-6 rounded-r-lg">
                                <h3 className="text-xl font-bold text-green-400 mb-2">Tuyên Ngôn Lãnh Đạo</h3>
                                <p className="text-gray-300">3 hành động cụ thể bạn sẽ làm trong 90 phút đầu tiên khi quay lại làm việc.</p>
                            </div>

                            <div className="glass-panel p-8 rounded-xl space-y-6">
                                <div className="flex items-center gap-4">
                                    <span className="text-4xl text-green-500 font-header font-bold">01</span>
                                    <input type="text" className="input-field text-lg" placeholder="Hành động 1..." value={data.m6_act1} onChange={(e) => handleChange('m6_act1', e.target.value)} />
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="text-4xl text-green-500 font-header font-bold">02</span>
                                    <input type="text" className="input-field text-lg" placeholder="Hành động 2..." value={data.m6_act2} onChange={(e) => handleChange('m6_act2', e.target.value)} />
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="text-4xl text-green-500 font-header font-bold">03</span>
                                    <input type="text" className="input-field text-lg" placeholder="Hành động 3..." value={data.m6_act3} onChange={(e) => handleChange('m6_act3', e.target.value)} />
                                </div>
                            </div>

                            <button onClick={handlePrint} className="w-full bg-brand-orange hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105 flex items-center justify-center gap-2">
                                <i className="fas fa-print"></i> XUẤT KẾ HOẠCH HÀNH ĐỘNG (PDF/PRINT)
                            </button>
                        </div>
                    );
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen flex font-sans">
                    {/* SIDEBAR */}
                    <div className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-6 border-b border-slate-800">
                            <div className="text-xs text-brand-orange font-bold tracking-widest uppercase mb-1">TECHFLOW WORKBOOK</div>
                            <h1 className="text-2xl font-header font-bold text-white">PHOENIX RESCUE CANVAS</h1>
                        </div>
                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            {MODULES.map((m) => (
                                <button 
                                    key={m.id}
                                    onClick={() => setActiveTab(m.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${activeTab === m.id ? 'bg-slate-800 border border-slate-700 shadow-lg' : 'hover:bg-slate-800/50 text-gray-400'}`}
                                >
                                    <i className={`fas ${m.icon} w-5 text-center ${activeTab === m.id ? m.color : ''}`}></i>
                                    <span className={`text-sm font-medium ${activeTab === m.id ? 'text-white' : ''}`}>{m.id}. {m.title}</span>
                                    {activeTab === m.id && <i className="fas fa-chevron-right w-4 ml-auto text-gray-500"></i>}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="text-xs text-center text-gray-500">
                                <i className="fas fa-save mr-1"></i> Tự động lưu
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 flex flex-col bg-slate-950 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <header className="p-8 border-b border-white/5 flex justify-between items-center no-print">
                            <div>
                                <h2 className="text-3xl font-header font-bold text-white">{MODULES[activeTab-1].title}</h2>
                                <p className="text-gray-400 text-sm">Điền vào các ô trống để hoàn thành bài tập.</p>
                            </div>
                            <div className="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center font-bold text-xl text-brand-teal border border-slate-700">
                                {activeTab}/6
                            </div>
                        </header>

                        <main className="flex-1 p-8 overflow-y-auto">
                            <div className="max-w-4xl mx-auto">
                                {renderContent()}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
